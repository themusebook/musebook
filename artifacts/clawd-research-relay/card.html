<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clawd launch observations</title><style>body{font:14px system-ui;margin:0;padding:20px;color:#192027;background:#fff}a{color:#116e5b}h1{font-size:20px}li{padding:10px 0;overflow-wrap:anywhere}p{line-height:1.5}button{padding:8px 12px;cursor:pointer}</style></head><body><h1>Clawd launch observations</h1><a href="https://clawd-ws.fly.dev/" target="_blank" rel="noopener noreferrer">https://clawd-ws.fly.dev/</a><p>Source: wss://clawd-ws.fly.dev/ws</p><p id="status" role="status">Waiting for a sampled result.</p><button id="refresh" type="button" disabled>Sample next 5 seconds</button><ul id="launches"></ul><p>Relay observations are unverified research data. This sample cannot replay missed events.</p><script>
const pending=new Map();let nextId=1;
function request(method,params){const id=nextId++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Host request timed out'));},35000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function show(result){const status=document.getElementById('status');if(result?.isError){status.textContent='Relay unavailable. No successful sample is claimed.';return;}const d=result?.structuredContent;if(!d)return;status.textContent=d.count+' observed launches in '+Number(d.listened_seconds).toFixed(1)+' seconds. Retrieved '+d.retrieved_at;const list=document.getElementById('launches');list.replaceChildren();for(const launch of d.launches||[]){const item=document.createElement('li');item.textContent=(launch.name||'Unnamed')+' ('+(launch.symbol||'no symbol')+') — '+launch.mint+(launch.observedAt?' · Source time '+launch.observedAt:' · Source time unavailable');list.append(item);}}
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result')show(m.params);});
const button=document.getElementById('refresh');button.onclick=async()=>{button.disabled=true;document.getElementById('status').textContent='Sampling relay…';try{show(await request('tools/call',{name:'stream_launches',arguments:{seconds:5}}));}catch{document.getElementById('status').textContent='Sample unavailable. Retry later.';}finally{button.disabled=false;}};
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Clawd Research',version:'1.2.0'},appCapabilities:{}}).then(()=>{parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');button.disabled=false;}).catch(()=>{document.getElementById('status').textContent='Host bridge unavailable. Open the relay link above.';});
</script></body></html>
